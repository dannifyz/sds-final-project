# Single entry point. The browser only ever talks to nginx, so the session
# cookie is same-origin for both the web app and the APIs.
#   /api/auth/*   -> auth-service     (/login, /logout, /me)
#   /api/sign     -> signing-service  (POST, auth checked via auth-service /me)
#   /api/verify   -> signing-service  (GET, public)
#   /*            -> web (Next.js)
# qr-service is internal only and is not routed here.

upstream web             { server web:3000; }
upstream auth_service    { server auth-service:8081; }
upstream signing_service { server signing-service:8082; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        proxy_pass http://auth_service/;
    }

    location = /api/sign {
        proxy_pass http://signing_service/sign;
    }

    location = /api/verify {
        proxy_pass http://signing_service/verify$is_args$args;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://web;
    }
}
