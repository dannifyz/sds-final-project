services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - auth-service
      - signing-service

  web:
    build: ./apps/web

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      PORT: "8081"
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  signing-service:
    build:
      context: .
      dockerfile: apps/signing-service/Dockerfile
    environment:
      PORT: "8082"
      TICKET_SECRET: ${TICKET_SECRET:?set TICKET_SECRET in .env}
      AUTH_SERVICE_URL: http://auth-service:8081
      QR_SERVICE_URL: http://qr-service:8083
    depends_on:
      - auth-service
      - qr-service

  qr-service:
    build:
      context: .
      dockerfile: apps/qr-service/Dockerfile
    environment:
      PORT: "8083"
